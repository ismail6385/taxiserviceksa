# Netlify deployment (moved from Vercel 2026-10-07). Netlify auto-detects
# Next.js and applies its Next.js runtime; no extra plugin config needed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # 1000+ pages: the default ~2GB Node heap runs out during next build
  NODE_OPTIONS = "--max-old-space-size=6144"
